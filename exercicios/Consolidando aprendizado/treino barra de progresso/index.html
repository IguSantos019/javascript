<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de progresso</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="script.js" async></script>
</head>
<body>
    <div class="containerPai">
        <div class="containerSteps">
            <hr class="frontHr">
            <hr class="backHr">
            <div class="step checked"><i class="fa-solid fa-check"></i></div>
            <div class="step" ><i class="fa-solid fa-xmark"></i></div>
            <div class="step"><i class="fa-solid fa-xmark"></i></div>
            <div class="step"><i class="fa-solid fa-xmark"></i></div>
            <div class="step"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="containerBtns">
            <button id="ant" class="btn" disabled><i class="fa-solid fa-arrow-left"></i></button>
            <button id="prox" class="btn"><i class="fa-solid fa-arrow-right-long"></i></button>
        </div>
    </div>
</body>
</html>
