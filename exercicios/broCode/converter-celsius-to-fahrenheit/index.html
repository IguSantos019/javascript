<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de graus para fahrenheit</title>
    <link rel="stylesheet" href="style-padrao.css">
</head>
<body>
    <header>
        <h1>Converta seus graus</h1>
    </header>
    <main>
        <label for="txtgraus" id="labeltxtgraus">Conversor de Temperatura:</label>
        <br>
        <input type="number" name="txtgraus" id="txtgraus">
        <br>
        <input type="radio" name="graus" id="celsiusToFahrenheit">
        <label for="celsiusToFahrenheit">Celsius &rightarrow;  Fahrenheit</label>
        <br>
        <input type="radio" name="graus" id="FahrenheittoCelsius">
        <label for="FahrenheittoCelsius">Fahrenheit &rightarrow;  Celsius</label>
        <br>
        <button id="botao" type="submit" onclick="converter()">Enviar</button>
        <p></p>
    </main>
    <footer>
        
    </footer>
    <script src="script.js"></script>
</body>
</html>
