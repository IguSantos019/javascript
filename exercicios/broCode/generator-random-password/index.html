<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senha aleatória</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 1.1em;
        }
        h1{
            text-align: center;
            margin-bottom: 20px;
        }
        main{
            margin: auto;
            width: 600px;
            text-align: center;
            box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
            padding: 20px;
            margin-bottom: 10px;
            border-radius: 10px;
        }
        button{
            font-size: 1.3em;
            margin: 10px 0px;
            
        }
    </style>
</head>
<body>
    <h1>Gerador de senha aleatória</h1>
    <main>
        
        <label for="botao">Clique no botão para gerar sua senha</label><br>
        <button type="submit" id="botao">Gerar senha</button>
        <div id="senhadiv">Senha:</div>
    </main>
    <script src="script.js"></script>
</body>
</html>
