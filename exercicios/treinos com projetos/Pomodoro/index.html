<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>


    <div class="containerPai">
        <h1>Pomodoro</h1>
        <div class="pomodoro">
            <div class="icons">
                <button class="settings">Settings</button>
                <button>Sign In</button>
            </div>
            <p class="numberPomodoro">25:00</p>
            <div class="buttons">
                <button class="startStop">Start</button>
                <button class="reset">Reset</button>
            </div>
                </div>
        </div>

        <div class="containerSettings">
            
            <div class="card">
                <div class="areaTittle">
                    <div class="settingsTittle"><h2>Settings</h2></div>
                    <div class="closeSettings"><button class="buttonCloseSettings">X</button></div>
                </div>
                <div><hr></div>
                <div class="ChoicePomodoroTime">
                    
                    <select>
                        <option value="25">25:00</option>
                        <option value="30">30:00</option>
                        <option value="35">35:00</option>
                        <option value="40">40:00</option>
                        <option value="50">50:00</option>
                    </select>
                    <br>
                    <br>
                    <button>Selecionar</button>
                </div>
            </div>
        </div>
</body>
</html>
