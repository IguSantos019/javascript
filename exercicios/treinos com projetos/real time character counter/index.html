<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de caractere</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Contador de Caracteres</h1>
        <textarea class="inptChars" placeholder="Escreva seu texto aqui..."></textarea>
        <div class="counterChars">
            <div class="totalMore">Total de Caracteres: <span class="numbersChars" id="totalMoreNumber" style="color: blue;">0</span></div>
            <div class="totalLess">Caracteres restantes: <span class="numbersChars" style="color: red;">50</span></div>
        </div>
    </div>
</body>
</html>
