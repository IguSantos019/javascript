<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 03 de Javascript</title>
    <style>
        body {
            background-color: rgb(181, 181, 228);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    
    <script>
        window.alert('Vamos somar!')
        var n1 = Number(window.prompt('Digite um número'))
        var n2 = Number(window.prompt('Digite outro número'))
        var soma = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${soma}`) // Esta forma se chama templete string com o placeholder
        
    </script>
</body>
</html>
