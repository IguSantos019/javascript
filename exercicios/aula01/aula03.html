<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 03 de Javascript</title>
    <style>
        body {
            background-color: rgb(181, 181, 228);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    
    <script>
        window.alert('Vamos somar!')
        var n1 = window.prompt('Digite um número')
        var n2 = window.prompt('Digite outro número')
        var soma = Number(n1) + Number(n2)
        window.alert('O valor da soma é ' + soma)
        
    </script>
</body>
</html>
