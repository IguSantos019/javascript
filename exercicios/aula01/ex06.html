<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        body {
            font-size: 1.3em;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        div#area {
            background-color: rgb(0, 54, 0);
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0px 0px 4px rgba(0, 0, 0, 0.452);
            margin: 50px;
            cursor: pointer;
        }
        div#contagem {
            background-color: rgb(141, 77, 4);
            width: 100px;
            height: 100px;
            line-height: 100px;
            text-align: center;
            color: white;
            border-radius: 50%;
            margin-left: 50px;
        }
    </style>
</head>
<body>
    <div id="area">
        Interaja
    </div>

    <div id="contagem" onclick="clickMoreOne()">
        0
    </div>
    <script>
        var area = window.document.getElementById('area')
        area.addEventListener('click', clicar)
        area.addEventListener('mouseenter', entrar)
        area.addEventListener('mouseleave', sair)
        
        function clicar() {
            area.innerText = 'Clicou!' 
            
        }

        function entrar () {
            area.style.backgroundColor = 'red'
        }
        function sair() {
            area.style.width = '200px'
            area.style.height = '200px'
            area.innerText = 'Interaja'
            area.style.backgroundColor = 'rgb(0, 54, 0)'
        }
        function clickMoreOne() {
            var cont = document.getElementById('contagem')
            cont.innerText = Number(5)
            
        }
    </script>
</body>
</html>
