<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 06</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container{
            width: 700px;
            height: 400px;
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
        }
        .column{
            width: 225px;
            background-color: slateblue;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 19px;
        }
        .item{
            background-color: #fff;
            width: 100%;
            height: 75px;
            padding: 10px;
            border-radius: 15px;
            font-size: 1.6em;
            font-family: arial;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
            color: rgb(39, 39, 39);
            cursor: pointer;
        }
        .dragging{
            opacity: .5;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="column">
            <div class="item" draggable="true">Card 1</div>
            <div class="item" draggable="true">Card 2</div>
        </div>
        <div class="column">
            <div class="item" draggable="true">Card 3</div>
            <div class="item" draggable="true">Card 4</div>
        </div>
        <div class="column">
            <div class="item" draggable="true">Card 5</div>
            <div class="item" draggable="true">Card 6</div>
        </div>
    </div>


    <script>
        const columns = document.querySelectorAll('.column');
        
        document.addEventListener('dragstart', function(e){
            e.target.classList.add('dragging');
        })
        document.addEventListener('dragend', function(e){
            e.target.classList.remove('dragging');
        })
        
        columns.forEach(item => {
                item.addEventListener('dragover', function(e){
                    const dragging = document.querySelector('.dragging');
                    const applyAfter = getNewPosition(item, e.clientY);
                    console.log(e.clientY)
                    if(applyAfter){
                        applyAfter.insertAdjacentElement('afterend', dragging);
                    }else{
                        item.prepend(dragging);
                    }
                    
                })
            function getNewPosition(column, posY){
                    const cards = column.querySelectorAll('.item:not(.dragging)');
                    let result;

                    for(var refer_card of cards){
                        const box = refer_card.getBoundingClientRect();
                        console.log(box);
                        const boxCenterY =  box.y + (box.height / 2);

                        if(posY >= boxCenterY){
                            result = refer_card;
                        }
                    }
                    return result;
                }
        })
    </script>
</body>
</html>
