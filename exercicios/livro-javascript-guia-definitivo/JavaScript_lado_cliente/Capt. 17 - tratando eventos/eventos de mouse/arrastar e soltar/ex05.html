        const colunas = document.querySelectorAll('ul');
        const regexp = /\bdnd\b/;

        for(var i = 0; i < colunas.length; i++){
            if(regexp.test(colunas[i].className)){
                dnd(colunas[i]);
            }
        }

        function dnd(colunas){
            
            var items = colunas.querySelectorAll('li');
            for(var i = 0; i < items.length; i++){
                items[i].draggable = true;
            }
            colunas.ondragstart = function(e){
                var target = e.target;
                var dt = e.dataTransfer;
                dt.setData('Text', target.innerText || target.textContent);
                dt.effectAllowed = 'move';

                target.classList.add('dragging');
                //console.log(target.classList);
            }

            colunas.ondragover = function(e){
                var target = e.target;
                e.preventDefault();

                

            }

            colunas.ondrop = function(e){
                var target = e.target;
                var dt = e.dataTransfer;
                var text = dt.getData('text');

                if(text){
                    var li = document.createElement("li");
                    var txt = document.createTextNode(text);
                    li.appendChild(txt);
                    colunas.appendChild(li);
                    li.draggable = true;
                }
            }
            colunas.ondragend = function(e){
                var target = e.target;
                target.classList.remove('dragging');
                if(e.dataTransfer.dropEffect = 'move'){
                    target.parentNode.removeChild(target);
                }

            }
        }
