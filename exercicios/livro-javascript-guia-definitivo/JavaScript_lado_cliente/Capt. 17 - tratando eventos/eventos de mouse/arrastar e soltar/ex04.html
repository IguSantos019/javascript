<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Exemplo 04</title>
    <style>
        .container{

        }
        .listaContainer{
            display: flex;

            gap: 40px;
            margin-left: 140px;
            padding: 25px;
        }
        .lista{
            padding: 10px;
            border: 2px dashed grey;
            list-style-type: none;

            flex-direction: column;
            width: 200px;
            height: 200px;
        }
        li{
            cursor: pointer;
            background-color: #fff;
            padding: 5px;
            width: 100px;
            box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.164);
            
        }
        .arquivoEntrou{
            border: 2px dashed green;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="listaContainer">
            <ul class="lista dnd" >
                <li>Item 1</li>
                <li>Item 2</li>

            </ul>
            <ul class="lista dnd">

    <script>
        const regexp = /\bdnd\b/;
        var lists = document.querySelectorAll("ul");
        for(var i = 0; i < lists.length; i++){
            if(regexp.test(lists[i].className)){
                dnd(lists[i]);
            }else{
                lists[i].ondragenter = function(){
                    alert('Esta lista não pode ser arrastada nem receber itens');
                }
            }
        }

        function dnd(lists){
            const originalClass = lists.className;

            var items = lists.getElementsByTagName("li"); 
            for(var i = 0; i< items.length; i++){
               items[i].draggable = true;
            }

            itemArrastado = undefined;
            lists.ondragstart = function(e){
                itemArrastado = e.target;
                var text = itemArrastado.innerText || itemArrastado.innerHTML;
                var dt = e.dataTransfer;
                dt.setData('Text', text);
                dt.effectAllowed = 'copyMove';
            }
            
            lists.ondragenter = function(e){
                var relatedTarget = e.relatedTarget;
                var target = e.target
                target.classList.add("arquivoEntrou");
                
            }
            lists.ondragover = function(){
                

                return false;
            };
            
            lists.ondragleave = function(e){
                var relatedTarget = e.relatedTarget;
                var target = e.target;
                target.classList.remove("arquivoEntrou");                
            }
            lists.ondrop = function(e){
                var relatedTarget = e.relatedTarget;
                var target = e.target;
                
                var dt = e.dataTransfer;
                var text = dt.getData('text');

                if(text){
                    var li = document.createElement('li');
                    var txtLi = document.createTextNode(text);
                    li.appendChild(txtLi);
                    lists.appendChild(li);

                }

                }
            }

    </script>
</body>
</html>
