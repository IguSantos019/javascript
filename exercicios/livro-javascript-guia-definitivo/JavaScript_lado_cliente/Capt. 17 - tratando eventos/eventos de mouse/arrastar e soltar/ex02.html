<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
        }
        

        .box{
            width: 235px;
            height: 345px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid black;
            
        }
        img{
            cursor: pointer;
        }
        .sobreposto{
            background-color: #939393;
            border: 2px dashed black;
            
        }
        
    </style>
</head>
<body>
    <div class="box">
        <div class="preenchido" draggable="true">
            <img src="Monkey D_Luffy.jpg" alt="" width="235px" height="345px" >
        </div>
    </div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <script>
        const boxes = document.querySelectorAll('.box');
        const image = document.querySelector('img');
        boxes.forEach(box =>{
            box.addEventListener('dragover', function(e){
                e.preventDefault(); 
                box.classList.add('sobreposto');
            })
            box.addEventListener('dragleave', function(){
                box.classList.remove('sobreposto');

            })
            box.addEventListener('drop', function(){
                box.appendChild(image);

            })
            
        })
        


    </script>
</body>
</html>
