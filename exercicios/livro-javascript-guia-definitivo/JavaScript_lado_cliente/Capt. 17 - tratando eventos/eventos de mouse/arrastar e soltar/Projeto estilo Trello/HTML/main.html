<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto estilo Trello</title>
    <link rel="stylesheet" href="../CSS/main.css">
    <script src="../JS/main.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="infos">
        <small>Projeto estilo Trello</small>
        <h1>Board</h1>
    </div>
    <div class="container">
        <div class="column">
            <div class="tittle-addMoreTasks">
                <div class="tittle">
                    <h2>A fazer</h2>
                </div>
                <div class="addMoreTasks">
                    <i class="fa-solid fa-plus btnAdd" ></i>
                </div>
            </div>
            <hr>
            <div class="contents dnd">
                <div class="card">kjlkdjaslkjd</div>
                <div class="card">
                    <div class="textCard">
                        Card 1
                    </div>
                    <div class="add">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                </div>
            </div>

        </div>
        <div class="column">
            <div class="tittle-addMoreTasks">
                <div class="tittle poppins-light">
                    <h2>Em progresso</h2>
                </div>
                <div class="addMoreTasks">
                    <i class="fa-solid fa-plus btnAdd"></i>
                </div>
            </div>
            <hr>
            <div class="contents dnd">
                <div class="card"></div>
            </div>
        </div>
        <div class="column">
            <div class="tittle-addMoreTasks">
                <div class="tittle">
                    <h2>A analizar</h2>
                </div>
                <div class="addMoreTasks">
                    <i class="fa-solid fa-plus btnAdd"></i>
                </div>
            </div>
            <hr>
            <div class="contents dnd"></div>
        </div>
        <div class="column">
            <div class="tittle-addMoreTasks">
                <div class="tittle">
                    <h2>Concluído</h2>
                </div>
                <div class="addMoreTasks">
                    <i class="fa-solid fa-plus btnAdd"></i>
                </div>
            </div>
            <hr>
            <div class="contents dnd"></div>
        </div>
    </div>
</body>
</html>
