<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propagação de eventos</title>
    <style>
        body{
            display: flex;
            width: 100vw;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .first{
            width: 500px;
            height: 500px;
            background-color: green;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .second{
            width: 300px;
            height: 300px;
            background-color: aquamarine;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .third{
            width: 150px;
            height: 150px;
            background-color: brown;
        }
        button{
            width: 100px;
            height: 100px;

        }
    </style>
</head>
<body>
    
    <div class="first">
        <div class="second">
            <div class="third">

            </div>
        </div>
    </div>

    <div class="buttondiv">
        <button><a href="youtube.com" target="_blank">Abrir Youtube</a></button>
    </div>
    <script>
        const divs = document.querySelectorAll('div');

        divs.forEach(div => {
            div.addEventListener('click', function(event){
                event.stopPropagation();
                //event.preventDefault();
                console.log(div.classList.value);
                console.log(event.target.classList)

            }, false) //se estiver um true aqui ao lado o método preventDefault() não cancela o evento.
        })
        
        document.querySelector('button').addEventListener('click', function(){
            event.preventDefault();
        })
    </script>
</body>
</html>
