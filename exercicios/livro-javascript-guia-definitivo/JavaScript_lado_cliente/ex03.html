<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 13-2</title>
    <style>

        #clock{
            font: bold 24pt sans;
            background: #ddf;
            padding: 10px;
            border: solid black 2px;
            border-radius: 10px;

        }
    </style>
</head>
<body>
    <h1>Digital clock</h1>
    <span id="clock"></span>
    <script>

        function displayTime(){
            var elt = document.getElementById("clock");
            var now = new Date();
            elt.innerHTML = now.toLocaleTimeString();
            setTimeout(displayTime, 1000);
        }

        window.onload = displayTime();


    </script>
</body>
</html>
