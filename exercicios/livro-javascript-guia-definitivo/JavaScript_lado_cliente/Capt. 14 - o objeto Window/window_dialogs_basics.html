<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa de dialogos básicas</title>
</head>
<body>
    
    <script>
        
        do{
            var name = window.prompt("Qual seu nome?");
            var correct = window.confirm(`O nome ${name} está correto?`);
        }while(!correct)
        alert(`Olá ${name}! Bem-vindo`);
    </script>
</body>
</html>
