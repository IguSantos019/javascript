<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Olá, Mundo!</h1>
    <div id="item" style="background-color: blue; width: 100px; height: 100px; border: 3px solid darkblue; border-radius: 15px;">

    </div>
    <script>
        const ola = document.querySelector("h1");
        const item = document.querySelector('div#item');
        function scale(e, factor){
            var size = parseInt(window.getComputedStyle(e, "").fontSize);
            e.style.fontSize = factor * size + "px";


        }
        function scaleColor(e, factor){
            var color = window.getComputedStyle(e, "").backgroundColor;
            var components = color.match(/[\d\.]+/g);
            for(var i = 0;i < 3; i++){
                var x = Number(components[i] * factor);
                x = Math.round(Math.min(Math.max(x, 0), 255));
                components[i] = String(x);
            }
            if(components.length == 3){
                e.style.backgroundColor = "rgb(" + components.join() + ")";

            }
            else{
                e.style.backgroundColor = "rgba(" + components.join() + ")";
            }

        }
        scale(ola, 1.5)
        scaleColor(item, 1.1)
    </script>
</body>
</html>
