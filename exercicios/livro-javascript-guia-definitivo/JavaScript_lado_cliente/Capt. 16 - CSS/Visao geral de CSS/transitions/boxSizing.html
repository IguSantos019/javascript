<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box sizing</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            display: flex;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }
        .item1{
            width: 50%;
            border: 2px solid black;
            background-color: lightgreen;
        }
        .item2{
            width: 50%;
            border: 2px solid black;
            background-color: lightcyan;
        }
    </style>
</head>
<body>
    <div class="item1">

    </div>
    <div class="item2">

    </div>
</body>
</html>
