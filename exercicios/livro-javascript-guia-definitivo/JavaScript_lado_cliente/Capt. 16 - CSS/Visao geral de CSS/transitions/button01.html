<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation botao</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        div.container{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            
        }
        div.botoes{
            display: flex;
            flex-direction: column;
        }
        button{
            
            margin-bottom: 15px;
            padding: 15px;
            font-size: 1.1em;
            border-radius: 10px;
            border: none;
            box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.589);
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color ease-out 0.2s, transform ease-out 0.1s;
        }
        button#hover:hover{
            background-color: blue;
            color: white;
        }
        button#click:active{
            transform: scale(1.1);
            background-color: rgb(50, 50, 50);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="botoes">
            <button id="hover">Passe o mouse</button>
            <button id="click">Clique</button>
        </div>
    </div>
</body>
</html>
