<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movendo item abrindo a página</title>
    <style>
        .container{
            width: 600px;
            transform: translateX(-700px);
            transition: all ease 3s;
            border-radius: 10px;

        }
        .item{
            width: 600px;
            height: 300px;
            border-radius: 15px;
            background-color: #6939f1;
        }
        .windowOnload{
            transform: translateX(300px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"></div>
    </div>
    <script>
        window.onload = function(){
            const container = document.querySelector('.container');
            container.classList.add('windowOnload');
        }
    </script>
</body>
</html>
