<!DOCTYPE html>
<html  lang="pt-br">
    <head >
        <meta charset="UTF-8">
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body{
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100vw;
                height: 100vh;
            }
            
            button{
                width: 10%;
                height: 10%;
                border-radius: 10px;
                border: 1px solid red;
                color: red;
                font-size: 1.2em;
                padding: 10px;
                transition: all ease 0.3s;
                text-transform: uppercase;
            }
            button:hover{
                background-color: red;
                color: white;
                box-shadow: 1px 1px 2px black;
            }
        </style>
    </head>
    <body>
        <button>Passe o Mouse</button>    
        
    </body>

</html>
