<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>janela translucida</title>
    <style>
        #item1, #item2{
            width: 150px;
            height: 150px;
            background-color: #5982;
            border: 1px solid black;
            margin-bottom: 10px;

        }
        #item2{
            opacity: 0;
            transition: all linear 3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="item1"></div>
        <div id="item2"></div>
    </div>
    <button>mostrar</button>
    <script>
        const item2 = document.querySelector('#item2');
        document.querySelector('button').addEventListener('click', function(){
            item2.style.opacity = 1;
        })
    </script>
</body>
</html>
