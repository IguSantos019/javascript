<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <style>
        .arrowIcon {
            opacity: 0;
            position: relative;
            top: 3%;
            left: 2px;
        }
        button{
            height: 50px;
            padding: 0 25px;
            border: 1px solid black;

            border-radius: 20px;

            display: inline-flex;

        }
        button:hover{

            opacity: 1;
        }
    </style>
</head>

    <button>Mais informações<span class="arrowIcon">></span></button>
