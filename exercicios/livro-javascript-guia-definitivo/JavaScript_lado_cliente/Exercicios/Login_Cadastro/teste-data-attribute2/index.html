<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste data-attribute 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="containerProducts" class="ativa" >
        <div class="products">
            <button data-produto="Camisa preta" data-preco="49.9">Camisa Preta - R$49,9 un</button>
            <button data-produto="Tenis" data-preco="119.9">Tênis - R$119,9 un</button>
            <button data-produto="Camisa braca" data-preco="49.9">Camisa Branca - R$49,9 un</button>
            <button data-produto="Calça jeans" data-preco="99.9">Calça jeans - R$99,9 un</button>
        </div>
    </div>
    <div id="containerCarrinho" class="ativa">
        <div class="carrinho">
            <p id="adcPecas"><strong><u>Carrinho</u></strong></p>
            <p id="total">Total: R$ 0</p>
            <button id="comprar">Comprar</button>
        </div>
    </div>
    
    <p class="hide" id="agradecimento">Muito obrigado pela sua compra!</p>
    <script src="script.js"></script>
</body>
</html>
