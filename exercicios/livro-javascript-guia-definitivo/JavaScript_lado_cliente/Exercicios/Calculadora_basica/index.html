<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora básica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Calculadora básica</h1>
        <div>
            <label for="number01">1° número: </label><input type="number" name="number01" id="idNumber01">
            <br> 
            <button class="operadores" value="*">*</button>
            <button class="operadores">/</button>
            <button class="operadores">+</button>
            <button class="operadores">-</button>
            <br>
            <label for="number02">2° número: </label><input type="number" name="number02" id="idNumber02">
            <br>
            
            <input type="submit" id="calcular">
        </div>
        <p id="result">Resultado: </p>
    </main>


    <script src="script.js"></script>
</body>
</html>
