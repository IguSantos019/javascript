<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clique no paragrafo</title>
</head>
<body>
    <p id="foo">Clique neste paragrafo</p>

    <script>
        const paragrafo = document.getElementById("foo");

        paragrafo.onclick = mostrarMensagem;

        function mostrarMensagem(event){
            alert(`${event}, Parabéns você ganhou 1 bilhão de reais!`)
        }
    </script>
</body>
</html>
