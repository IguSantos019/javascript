<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributos HTML como propriedades de Element</title>
</head>
<body>
    <img id="myImage" src="https://i.pinimg.com/736x/8e/5a/76/8e5a762f6a23aba50611759702ab8c85.jpg" alt="Imagem de paisagem">


    <span>
        <form>
            <fieldset style="width: 600px;;">
                <legend>Formulário</legend>
                <label for="name">Nome: </label><input type="text" name="name" id="nameId">
                <label for="idade">idade: </label><input type="number" name="idade" id="idadeId">
                <button id="button">Enviar</button>
            </fieldset>
        </form>
    </span>
    <script>
        /*
            é possivel configurar atributos de tags HTML por meio de javascript.
        */
        var image = document.getElementById("myImage");
        var imgUrl = image.src;
        console.log(imgUrl);
        var imgId = image.id
        console.log(imgId);
        
        var f = document.forms[0];
        f.action = "example.php";
        f.method = "POST";
        
    </script>
</body>
</html>
