<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisando texto da wikipedia</title>
</head>
<body>
    


    <p>mage terraria build</p>
    <p>Terraria invocador</p>

    <a href="javascript: var e; 
        if(window.getSelection) e = window.getSelection().toString();
        else if(document.selection) e = document.selection.createRange().text;
        void window.open('https://youtube.com/results?search_query=' + e);
    ">Pesquise</a>

    <a href="javascript: var q;
        if(window.getSelection) q = window.getSelection().toString();
        void window.open('https://www.google.com/search?q=' + q + '&oq=' + q);

    
    ">Pesquise no google</a>
</body>
</html>
