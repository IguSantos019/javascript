<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionando elementos pelo nome</title>
    <style>
        #mainContent{
            text-align: center;
            font-size: 1.2em;
            font-family: Arial, Helvetica, sans-serif;
        }
        #radioButtonsSelected{
            font-size: 1.5em;
        }
        input{
            margin: 10px 0px;
        }
        input#Jardins{
            margin-left: -25px;
            margin-bottom: 25px;
        }
        button#btnEnviar{
            font-size: 1.2em;
            padding: 5px;

        }
    </style>
</head>
<body>
    <div id="mainContent">
        <h1>Olá seja bem-vindo!</h1>
        <p>
            Este site é apenas para a votação de qual casa do restaurante Varanda Grill você gostaria de estar. <br>
            Escolha abaixo:
        </p>
        <input type="radio" name="radioButtons" id="Jk iguatemi" value="Jk Iguatemi"> <label for="Jk iguatemi">Jk Iguatemi</label> <br>
        <input type="radio" name="radioButtons" id="Faria lima" value="Faria Lima"> <label for="Faria lima">Faria Lima</label> <br>
        <input type="radio" name="radioButtons" id="Jardins" value="Jardins"> <label for="Jardins">Jardins</label> <br>
        <button type="submit" id="btnEnviar">Enviar</button>
        
        <p id="radioButtonsSelected"></p>
    </div>

    <script>

        document.getElementById("btnEnviar").addEventListener("click", function(){
            var radioButtons = document.getElementsByName("radioButtons");
            var radioButtonsSelected = document.getElementById("radioButtonsSelected");

            var choices = [];
            for(var i = 0; i < radioButtons.length; i++){
                if(radioButtons[i].checked){
                    choices.push(radioButtons[i].value);
                }
            }
            radioButtonsSelected.innerHTML = `Você escolheu a unidade do <strong>${choices}</strong>. Veremos se poderemos manda-lo para lá <br> 
            Aguarde a confirmação!
            `;
        })

    </script>
</body>
</html>
