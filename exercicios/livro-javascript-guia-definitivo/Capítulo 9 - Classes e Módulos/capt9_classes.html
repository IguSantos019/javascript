        //função inherit
        //Criando um novo objeto que herda de um protótipo

        function inherit(p){
            if(p === null) throw TypeError();
            if(Object.create)
                return Object.create(p);
            var t = typeof(p);

            if(t !== "object" && t !== "function") throw TypeError();
            function f(){};
            f.prototype = p
            return new f();
        }

            Como vimos, o objeto protótipo é fundamental para a identidade de uma classe: dois objetos são instâncias da mesma classe se, e somente se, herdam do mesmo objeto protótipo. A função construtora que inicializa o estado de um novo objeto não é fundamental: duas funções construtoras podem ter propriedades prototype que apontam para o mesmo objeto protótipo. Então, as duas construtoras podem ser usadas para criar instâncias da mesma classe.

       //função extend do exemplo 6-2

       function extend(o, p){
            for(prop in p){
                o[prop] = p[prop];
            }
       }


       //Uma função simples para definir calsses simples
       function defineClass(constructor, methods, statics){
            if(methods) extend(constructor.prototype, methods)
            if(statics) extend(constructor, statics);
            return constructor;
       }
       var simpleRange = defineClass(function(f, t){this.f = f; this.t = t;},{
            includes: function(x){return this.f <= x && x <= this.t},

       })

    function typeAndValue(x){
        if(x == null) return ""; //null e undefined não tem construtoras

        switch(x.constructor){
            case Number: return `Number: ${x}`;
            case String: return `String: '${x}'`;
            case Date: return `Date: ${x}`;
            case RegExp: return `RegExp: ${x}`;
            //case Complex: return `Complex: ${x}`;
        }
    }

    function classof(o){
        if(o === null) return "Null";
        if(o === undefined) return "Undefined";
        return Object.prototype.toString.call(o).slice(8, -1);
    }

    //function type() para determinar o tipo de um valor:
    Function.prototype.getName = function(){
        if("name" in this) return this.name;
        return this.name = this.toString().match(/function\s*([^(]*)\(/)[1];
    }

    function type(o){
        var t, c, n; //tipo, classe, nome
        
        //caso especial para o valor Null
        if(o === null) return "null";
        //outro caso especial: NaN é o único valor que não é igual
        //a si mesmo
        if(o !== o) return "nan";

        if((t = typeof o) !== "object") return t;

        if((c = classof(o) !== "Object")) return c;

        if(o.constructor && typeof o.constructor === "function" &&
            (n = o.constructor.getName())) return n;

        return "Object";
    }
