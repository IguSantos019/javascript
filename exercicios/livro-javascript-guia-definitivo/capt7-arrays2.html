                //função que localiza todas as ocorrencias de um valor x em um array
                function findAll(a, x){
                    const allValuesCoicidents = [];
                    let i = 0;
                    while(i < a.length){
                        i = a.indexOf(x, i);
                        if(i === -1)break;
                        allValuesCoicidents.push(i);
                        i++;
                    }
