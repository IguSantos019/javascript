<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <section class="containerPai">
        <div class="card">
            <div class="esquerda">
                <div class="formLogin"> 
                    <h1>Fazer Login</h1>
                    <form>
                        <input type="email" name="email" id="emailID" placeholder="E-mail">
                         <br>
                        <input type="password" name="senha" id="senhaID" placeholder="Senha">
                        <br>
                        <button>Entrar</button>
                    </form>
                </div>

                <div class="facaLogin">
                    <h2>Já<br> uma conta?</h2>
                    <p>Faça login clicando no botão abaixo</p>
                    <button>Faça login</button>
                </div>
            </div>

            <div class="direita">
                <div class="facaCadastro">
                    <h2>Não tem uma conta?</h2>
                    <p>Cadastre-se clicando no botão abaixo</p>
                    <button>Cadastre-se</button>
                </div>

                <div class="formCadastro">
                    <h2>Cadastro</h2>
                    <input type="text" name="nome" id="nomeID" placeholder="Nome">
                    <input type="email" name="email" id="emailID" placeholder="E-mail">
                    <input type="password" name="senha" id="senhaID" placeholder="Senha">
                    <input type="password" name="confirmSenha" id="confirmID" placeholder="Confirmação de senha">
                    <button>Entrar</button>
                </div>

            </div>
        </div>
    </section>
