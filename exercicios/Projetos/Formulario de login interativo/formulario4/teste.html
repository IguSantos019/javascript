<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <style>
        .containerPai{
            width: 100vw; height: 100vh;
            display: flex;
            align-items: center; justify-content: center;
        }
        .card{
            display: flex;
            align-items: center; justify-content: center;
            width: 80%; height: 90vh;
            position: relative;
            background-color: rgba(0, 0, 0, 0.50);
            z-index: 1;
        }
        .content{
        }
        
        .card::after{
            content: "";
            background-image: linear-gradient(to bottom, #fff, #0000ff);
            z-index: -1;
            position: absolute;
            top: 0;
            left: 0;
            
            width: 100%; 
            height: 100%;
        }
        
    </style>
</head>
<body>
    <div class="containerPai">
        <div class="card">
            <div class="content">
                <h2>Igor é foda</h2>

        </div>
    </div>
</body>
</html>
