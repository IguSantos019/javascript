<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="containerPai">
        <div class="card loginActive">
            <div class="esquerda">
                <div class="areaLogar">
                    <h2>Fazer Login</h2>
                    <form>
                        <input type="email" placeholder="E-mail">
                        <input type="password" placeholder="Senha">
                        <button>Entrar</button>
                    </form>
                </div>
                <div class="areaFacaLogin">
                    <h2>Já tem <br> uma conta?</h2>
                    <p>Faça o login clicando no botão abaixo</p>
                    <button>Fazer login</button>
                </div>
            </div>
            <div class="direita">
                <div class="areaFacaCadastro">
                    <h2>Não tem <br> uma conta?</h2>
                    <p>Cadastre-se clicando no botão abaixo</p>
                    <button>Cadastre-se</button>
                </div>
                <div class="areaCadastrar">
                    <h2>Cadastro</h2>
                    <form>
                        <input type="text" placeholder="Nome">
                        <input type="email" placeholder="E-mail">
                        <input type="password" placeholder="Senha">
                        <input type="password" placeholder="Confirme sua senha">
                        <button>Cadastrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
