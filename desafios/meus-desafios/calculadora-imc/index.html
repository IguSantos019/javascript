<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Calculadora IMC</h1>
        <hr>
        <div id="labelsDiv">
            <label for="nome">Nome: </label> <input type="text" id="name" name="name" > <br>
            <label for="height">Altura: </label> <input type="text" id="height" name="height" value="1"> <br>
            <label for="peso">Peso: </label> <input type="number" name="weight" id="weight">
        </div>
        <br>
        <button type="submit" id="buttonCal">Calcular</button>
        <div id="result"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
