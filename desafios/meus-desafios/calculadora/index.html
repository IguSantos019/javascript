<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>
        <div id="fora">
            
            <div id="agrupa">
                <div id="resul">
                    
                </div>
                <div id="primLinha">
                    <button id="div" onclick="insert('/')">/</button>
                    <button id="limpar" onclick="lim()">C</button>
                    <button id="apagar" onclick="apag()">⌫</button>
                </div>
                <div id="segLinha">
                    <button id="sete" onclick="insert('7')">7</button>
                    <button id="oito" onclick="insert('8')">8</button>
                    <button id="nove" onclick="insert('9')">9</button>
                    <button id="mult" onclick="insert('*')">X</button>
                </div>
                <div id="terLinha">
                    <button id="quatro" onclick="insert('4')">4</button>
                    <button id="cinco" onclick="insert('5')">5</button>
                    <button id="seis" onclick="insert('6')">6</button>
                    <button id="sub" onclick="insert('-')">-</button>
                </div>
                <div id="quarLinha">
                    <button id="um" onclick="insert('1')">1</button>
                    <button id="dois" onclick="insert('2')">2</button>
                    <button id="tres" onclick="insert('3')">3</button>
                    <button id="adc" onclick="insert('+')">+</button>
                </div>
                <div id="quinLinha">
                    <button id="zero" onclick="insert('0')">0</button>
                    <button id="virgula" onclick="insert('.')">,</button>
                    <button id="ponto" onclick="insert(',')">.</button>
                    <button id="resultado" onclick="res()">=</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
