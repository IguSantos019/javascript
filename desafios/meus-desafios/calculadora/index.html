<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>
        <div id="fora">
            
            <div id="agrupa">
                <div id="resul">
                    0
                </div>
                <div id="primLinha">
                    <button>/</button>
                    <button id="apaLinha">CE</button>
                    <button id="limpar">C</button>
                    <button id="apagar">⌫</button>
                </div>
                <div id="segLinha">
                    <button id="sete">7</button>
                    <button id="oito">8</button>
                    <button id="nove">9</button>
                    <button id="mult">X</button>
                </div>
                <div id="terLinha">
                    <button id="quatro">4</button>
                    <button id="cinco">5</button>
                    <button id="seis">6</button>
                    <button id="sub">-</button>
                </div>
                <div id="quarLinha">
                    <button id="um">1</button>
                    <button id="dois">2</button>
                    <button id="tres">3</button>
                    <button id="adc">+</button>
                </div>
                <div id="quinLinha">
                    <button id="zero">0</button>
                    <button id="virgula">,</button>
                    <button id="ponto">.</button>
                    <button id="resultado">=</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
