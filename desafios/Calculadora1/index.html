<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="content">
        <div id="showResult">0</div>
        <div class="operators">
            <button>+</button>
            <button>-</button>
            <button>*</button>
            <button>/</button>
        </div>
        <button id="equal">=</button>

        <div class="nums">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <br>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <br>
            <button>1</button>
            <button>2</button>
            <button>3</button>
        </div>
        <div>
            <button>0</button>
            <button>.</button>
        </div>

    </main>
</body>
</html>
