<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se ou faça o login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="content">
        
        <div class="abas">
            <button id="btnEntrar">Entrar</button>
            <button id="btnCadastrar">Cadastrar</button>
            <div class="abaEntrar">
                
                <label for="email">Email:</label><input type="text" name="email" id="idEmail" placeholder="Digite seu email">
                <br>
                <label for="senha">Senha:</label><input type="password" name="senha" id="idSenha" placeholder="Digite sua senha">
            </div>
            <div class="abaCadastrar">
                
                <label for="email">Email:</label><input type="text" name="email" id="idEmail" placeholder="Digite seu email">
                <br>
                <label for="senha">Senha:</label><input type="password" name="senha" id="idSenha" placeholder="Digite sua senha">
                <br>
                <label for="senha">Senha:</label><input type="password" name="confirmSenha" id="idConfirmSenha" placeholder="Confirme sua senha">
            </div>
            <button class="" data-action="logar">Login</button>
        </div>

    </main>


</body>
</html>
