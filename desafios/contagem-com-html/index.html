<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>Vamos Contar</h1>
    </header>
    <main>
        <div id="paragrafo">
            <p>Preencha com os números abaixo:</p>
        </div>
        <section id="formulario">
            <label for="inicio">Ínicio: </label>
            <input type="number" name="inicio" id="inicio">*
            <br>
            <label for="fim">Fim: </label>
            <input type="number" name="fim" id="fim">*
            <br>
            <label for="passo">Passo: </label>
            <input type="number" name="passo" id="passo">
            <br>
            <input id="botao" type="button" value="Enviar" onclick="somar()">
        </section>
        <section id="resul">
            <p>Contagem em processo...</p>
        </section>
    </main>
    <footer>
        <p>@ CursoemVideo</p>
    </footer>
</body>
</html>
