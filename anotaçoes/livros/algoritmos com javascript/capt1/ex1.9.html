<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizinhos</title>
</head>
<body>
    <script>

        alert("Quais vizinhos você tem");
        const numeroDaCasa = Number(prompt("Qual o número da sua casa?"));
        const vizinhoAnt = numeroDaCasa - 1;
        const vizinhoProx = numeroDaCasa + 1;

        alert(`Sua casa é de número ${numeroDaCasa}, seus vizinhos são ${vizinhoAnt} e ${vizinhoProx}`);
    </script>
</body>
</html>
