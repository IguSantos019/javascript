<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1.6</title>
</head>
<body>
    
    <script>
        const number1 = prompt("Digite um número para somar!");
        alert("Número 1: " + number1);
        const number2 = window.prompt("Digite outro número!");
        alert("Número 2: " + number2);
        let resultSoma = Number(number1) + Number(number2);
        window.alert(`A soma entre ${number1} e ${number2} é igual a ${resultSoma}`);

    </script>
</body>
</html>
