<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1.3</title>
</head>
<body>
    
    <script>
        const a = "20";
        const b = a * 2 // b == 40
        console.log(b);
        const c = a / 2; // c == 10
        console.log(c);
        const d = a - 2; // d == 18
        console.log(d);
        const e = a + 2; // 202?
        console.log(e);
        alert("e: " + e);
        alert("O tipo de e é: " + typeof(e));

        const f = Number(a) + 2;
        console.log(f);
        alert("f: " + f);

    </script>
</body>
</html>
