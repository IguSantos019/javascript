<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de horas</title>
</head>
<body>
    

    <script>
        alert("Contador de horas de uma viagem");
        const dias = Number(prompt("Quantos dias durou?"));
        const horas = Number(prompt("Quantas horas durou?"));
        const resultado = (dias * 24) + horas;
        alert(resultado);
    </script>
</body>
</html>
