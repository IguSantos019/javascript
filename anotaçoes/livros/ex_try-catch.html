<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de try...catch</title>
</head>
<body>
    

    <script>
        while(isNaN(n) || n == 0){
            try{
                var n = window.prompt('Digite um número!')
                verifyNum()
                var r = square(n)
                alert(`${n}² = ${r}`)
            }catch (e){
                alert(e.message)
            }
        }
        function verifyNum(){
            if(isNaN(n)){
                throw Error('nao é numero')
            }
            if(n == 0){
                throw Error('0 não é multiplicável!')
            }
        }
        function square(x){
            return x*x
        }
    </script>
</body>
</html>
